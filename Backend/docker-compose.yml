services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "14330:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Passw0rd!"
    volumes:
      - backend_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  backend_sql_data: